<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorApp</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="images/midfirst-logo.svg" />

    <link id="telerik-theme-meridian"
          href="css/meridian-main.css"
          rel="stylesheet" />

    <link id="telerik-theme-meridian-dark"
          rel="stylesheet"
          href="css/meridian-main-dark.css"
          disabled />
    <!-- 4. App-specific CSS -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BlazorApp.styles.css" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-progress">
                <img class="loading-progress-logo" src="images/midfirst-logo.svg" alt="MidFirst logo" />
            </div>
            <div id="loading-application-name" class="loading-application-name" aria-live="polite"></div>
            <div id="loading-environment-warning" class="loading-environment-warning"></div>
            <div id="loading-environment-text" class="loading-environment-text" aria-live="polite"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="theme-switcher.js"></script>
    <script>
        (async function () {
            const textElement = document.getElementById("loading-environment-text");
            const warningElement = document.getElementById("loading-environment-warning");
            const appNameElement = document.getElementById("loading-application-name");
            if (!textElement || !warningElement || !appNameElement) {
                return;
            }

            try {
                const response = await fetch("environment.json", { cache: "no-store" });
                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                const rawEnvironment = (data.environment || data.Environment || "").toString().trim();
                const environment = rawEnvironment.toLowerCase();
                const isDebugMode = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

                if (isDebugMode && environment && environment !== "local") {
                    warningElement.textContent = `You are not running local. You are running against ${rawEnvironment}.`;
                    warningElement.style.display = "block";
                }

                if (environment === "development") {
                    textElement.textContent = "Development";
                    textElement.style.color = "#99FF99";
                    textElement.style.display = "block";
                }
                else if (environment === "deployment") {
                    textElement.textContent = "UAT";
                    textElement.style.color = "#9999FF";
                    textElement.style.display = "block";
                }

                const envSettingsResponse = rawEnvironment
                    ? await fetch(`appsettings.${rawEnvironment}.json`, { cache: "no-store" })
                    : null;
                const baseSettingsResponse = await fetch("appsettings.json", { cache: "no-store" });

                let appName = "";
                if (envSettingsResponse && envSettingsResponse.ok) {
                    const envSettings = await envSettingsResponse.json();
                    appName = (envSettings.applicationName || envSettings.ApplicationName || "").toString().trim();
                }

                if (!appName && baseSettingsResponse.ok) {
                    const baseSettings = await baseSettingsResponse.json();
                    appName = (baseSettings.applicationName || baseSettings.ApplicationName || "").toString().trim();
                }

                if (appName) {
                    appNameElement.textContent = appName;
                    appNameElement.style.display = "block";
                }
            } catch {
                // keep loading labels empty if configuration cannot be read
            }
        })();
    </script>
    <script src="_content/Telerik.UI.for.Blazor/js/telerik-blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
