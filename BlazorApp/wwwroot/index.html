<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorApp</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="images/midfirst-logo.svg" />

    <link id="telerik-theme-meridian"
          href="css/meridian-main.css"
          rel="stylesheet" />

    <link id="telerik-theme-meridian-dark"
          rel="stylesheet"
          href="css/meridian-main-dark.css"
          disabled />
    <!-- 4. App-specific CSS -->
    <link rel="stylesheet" href="css/app.css" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg class="loading-progress-spinner" viewBox="0 0 100 100" aria-hidden="true">
                <circle r="40" cx="50" cy="50" />
                <circle r="40" cx="50" cy="50" />
            </svg>
            <img class="loading-progress-logo" src="images/midfirst-logo.svg" alt="MidFirst logo" />
        </div>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="theme-switcher.js"></script>
    <script src="_content/Telerik.UI.for.Blazor/js/telerik-blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
